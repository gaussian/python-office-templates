[build-system]
requires = [
  "setuptools>=61.0",
  "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "office-templates"
version = "0.5.3"
description = "Generates Office documents (PPTX/XLSX) from template files that are flexibly populated or composed using provided context."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "python-pptx>=1,<2",
]

[project.optional-dependencies]
xlsx = [
  "openpyxl>=3,<4",
]

[project.urls]
Homepage = "https://github.com/gaussian/python-office-templates"
Issues = "https://github.com/gaussian/python-office-templates/issues"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint]
# Pin to the classic real-errors rule set (pyflakes + core pycodestyle) rather
# than ruff's newer, broader default which pulls in style/modernization rules.
# F401 (side-effect imports / re-exports look unused; F821 still catches
# genuinely-missing imports) and F841 (intentional unused locals) are excluded.
select = ["E4", "E7", "E9", "F"]
ignore = ["F401", "F841"]

[tool.ruff.lint.per-file-ignores]
# __init__.py uses star imports to re-export the public API.
"__init__.py" = ["F403"]
